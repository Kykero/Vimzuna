# .tmux.conf — companion config for the Vimzuna Neovim setup.
#
# This file does NOT belong to the Nix flake: tmux is a separate program.
# Copy it where tmux looks for its config:
#   cp .tmux.conf ~/.config/tmux/tmux.conf   # tmux >= 3.1 (recommended)
#   # or: cp .tmux.conf ~/.tmux.conf
# On NixOS you can instead wire it through Home-Manager (programs.tmux).
# Requires tmux >= 3.2 for the lazygit popup (display-popup).

# --- Prefix: Ctrl-a (swap back to C-b here if you prefer the default) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Neovim-friendly terminal ---
set -sg escape-time 0
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"           # truecolor
set -ga terminal-overrides ",*:Smulx=\\E[4::%p1%dm" # undercurl support

# --- Comfort ---
set -g mouse on
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000

# --- Splits open in the current pane's directory ---
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Reload config: Prefix r ---
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Lazygit in a centered popup: Prefix g ---
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# --- vim-tmux-navigator: Ctrl-h/j/k/l cross nvim splits <-> tmux panes ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# --- Theme: tokyonight (moon), matching the Neovim colorscheme ---
set -g status-position top
set -g status-style "bg=#222436,fg=#c8d3f5"
set -g status-left "#[bg=#82aaff,fg=#222436,bold] #S #[bg=#222436,fg=#82aaff]"
set -g status-left-length 30
set -g status-right "#[fg=#828bb8] %H:%M #[bg=#82aaff,fg=#222436,bold] #h "
set -g window-status-format "#[fg=#828bb8] #I:#W "
set -g window-status-current-format "#[bg=#3b4261,fg=#c8d3f5,bold] #I:#W "
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#82aaff"
set -g message-style "bg=#82aaff,fg=#222436"
